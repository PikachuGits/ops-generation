name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops-generation/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ops-generation/requirements.txt
      - name: Run tests
        working-directory: ops-generation
        run: python -m pytest -q --cov=app --cov-report=term-missing
